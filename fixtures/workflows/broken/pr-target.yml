# Kaputt mit Absicht: pull_request_target checkt den PR-Kopf aus.
name: pr-target
on:
  pull_request_target:
permissions:
  contents: read
jobs:
  bauen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@0123456789abcdef0123456789abcdef01234567
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - run: ./build.sh
