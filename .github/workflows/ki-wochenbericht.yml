# Der wiederkehrende Auftrag: montags messen und berichten.
#
# **Er laeuft auch ohne KI.** Das ist Absicht und nicht Sparsamkeit: die
# Zahlen rechnet Python, und die taugen fuer sich. Ist das Secret
# `COPILOT_PAT` hinterlegt, kommt oben drauf eine Einordnung in Worten;
# fehlt es, steht im Bericht **ausdruecklich**, dass keine da ist.
#
# Damit geht der Lauf nie rot, nur weil ein KI-Dienst nicht antwortet -- und
# er tut trotzdem nie stillschweigend nichts. Beides war schon einmal ein
# Fehler in diesem Projekt.
#
# **Ob ein Issue aufgeht, entscheidet die Messung, nicht das Modell.** Sonst
# haenge eine Entscheidung an einem Satz, den ein Modell naechste Woche
# anders formuliert.
#
# Die Gegenprobe laeuft hier **nicht** noch einmal: das tut der `Wochenlauf`,
# und er wird von selbst rot, wenn eine Mutation entkommt. Zweimal dasselbe
# zu rechnen macht den Bericht nicht wahrer.
name: KI-Wochenbericht

on:
  schedule:
    # Nach dem Wochenlauf (43 6 * * 1), damit ein frisches Ergebnis vorliegt.
    - cron: "20 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write     # nur, wenn die Messung etwas findet

jobs:
  bericht:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Der Kern der Arbeit. **Kein `if:`** -- ein uebersprungener Schritt
      # sieht genauso aus wie ein erfolgreicher.
      - name: Messen
        id: messen
        run: |
          set -uo pipefail
          python3 -m unittest discover -s checks -t . -q > pruefung.txt 2>&1
          pruefstand=$?
          pruefungen=$(grep "^Ran" pruefung.txt || echo "Ran ? tests")
          if [ "$pruefstand" -eq 0 ]; then ergebnis="OK"; else ergebnis="FEHLGESCHLAGEN (Exit $pruefstand)"; fi
          mutationen=$(python3 -c 'from checks.counterproof import MUTATIONEN; print(len(MUTATIONEN))')
          regeln=$(python3 -c 'from webseite import build; print(sum(len(m.regeln()) for m, _, _ in build.BOTS), "Regeln in", len(build.BOTS), "Bots")')
          for bot in secret-bot workflow-bot code-bot license-bot; do
            python3 -m chinook.cli "$bot" --path . --fail-on never --json "befunde-$bot.json" > "ausgabe-$bot.txt" 2>&1 || true
          done
          befunde=$(python3 -c 'import json,glob; print(sum(len(json.load(open(f)).get("findings", [])) for f in sorted(glob.glob("befunde-*.json"))))')
          {
            echo "## Gemessen am $(date -u +%F)"
            echo
            echo "- Pruefungen: $pruefungen -- $ergebnis"
            echo "- Mutationen in der Gegenprobe: $mutationen"
            echo "- Regeln: $regeln"
            echo "- Befunde der Bots im eigenen Repo: $befunde"
            echo
            echo "### Was die README behauptet"
            echo
            grep -n -E "checks, all green|mutations, all caught" README.md || echo "(keine Zahl gefunden)"
            echo
            echo "### Ausgabe der Bots"
            echo
            for a in ausgabe-*.txt; do
              echo "#### $a"
              head -c 2000 "$a"
              echo
            done
          } > messung.md
          # Die Frage, die die Messung selbst beantwortet -- nicht das Modell.
          auffaellig="nein"
          if [ "$befunde" -gt 0 ]; then auffaellig="ja"; fi
          if [ "$pruefstand" -ne 0 ]; then auffaellig="ja"; fi
          zahl=$(echo "$pruefungen" | awk '{print $2}')
          if ! grep -q "$zahl checks, all green" README.md; then auffaellig="ja"; fi
          if ! grep -q "$mutationen mutations, all caught" README.md; then auffaellig="ja"; fi
          echo "auffaellig=$auffaellig" >> "$GITHUB_OUTPUT"
          echo "Auffaellig: $auffaellig"
          cat messung.md

      - name: Ist das Token hinterlegt?
        id: token
        env:
          TOKEN: ${{ secrets.COPILOT_PAT }}
        run: |
          set -euo pipefail
          if [ -z "${TOKEN:-}" ]; then
            echo "da=nein" >> "$GITHUB_OUTPUT"
            echo "Kein COPILOT_PAT -- der Bericht kommt ohne Einordnung."
          else
            echo "da=ja" >> "$GITHUB_OUTPUT"
            echo "COPILOT_PAT ist hinterlegt."
          fi

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Copilot-CLI installieren
        run: npm install -g @github/copilot

      # **Hier ist ein `if:` erlaubt**, und nur hier: dieser Schritt ist
      # ausdruecklich die Zugabe, nicht die Arbeit. Dass er uebersprungen
      # wurde, steht unten im Bericht im Klartext -- still verschwinden kann
      # er also nicht. `continue-on-error`, weil ein fremder Dienst den
      # Wochenbericht nicht kippen soll.
      # Die CLI direkt, wie beim Knopf: `actions/ai-inference` verschluckt
      # die Fehlerausgabe und meldet nur "exited with code 1". Hier waere das
      # besonders teuer -- der Schritt darf fehlschlagen, ohne den Lauf zu
      # kippen, und dann stuende im Bericht "keine Einordnung", ohne dass
      # irgendwo der Grund steht. Ein Fehlschlag ohne Grund ist einer, den
      # niemand behebt.
      #
      # **Hier ist ein `if:` erlaubt**, und nur hier: dieser Schritt ist
      # ausdruecklich die Zugabe, nicht die Arbeit. Dass er uebersprungen
      # wurde, steht unten im Bericht im Klartext.
      - name: Die KI einordnen lassen
        id: ki
        if: steps.token.outputs.da == 'ja'
        continue-on-error: true
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_PAT }}
        run: |
          set +e
          anweisung='Du liest den Wochenbericht des Repos "Chinook Security" -- eines Werkzeugkastens aus Sicherheits-Bots. Dir werden gemessene Zahlen vorgelegt. Sage in hoechstens zehn Zeilen auf Deutsch, was daran Aufmerksamkeit verdient und was nicht. Weichen die Zahlen der README von den gemessenen ab, ist das der wichtigste Punkt. Rechne nichts nach, was nicht dasteht, und erfinde keine Zahlen, keine Dateinamen und keine Commit-SHAs. Steht nichts Auffaelliges drin, sag genau das in einem Satz.'
          printf '%s\n\n' "$anweisung" > auftrag.txt
          cat messung.md >> auftrag.txt
          copilot -p "$(cat auftrag.txt)" -s --no-ask-user > einordnung.txt 2> fehler.txt
          stand=$?
          if [ "$stand" -ne 0 ]; then
            echo "::warning::Die Copilot-CLI ist mit Exit $stand ausgestiegen. Der Bericht kommt ohne Einordnung; ihre Meldung steht darunter."
            echo "--- Meldung der CLI ---"
            cat fehler.txt
            echo "--- Ende ---"
            rm -f einordnung.txt
          elif [ ! -s einordnung.txt ]; then
            echo "::warning::Die CLI ist ohne Fehler ausgestiegen, hat aber nichts geantwortet."
            cat fehler.txt
            rm -f einordnung.txt
          else
            echo "Einordnung: $(wc -c < einordnung.txt) Zeichen."
          fi
          exit 0

      - name: Bericht ablegen
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          LAUF: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          AUFFAELLIG: ${{ steps.messen.outputs.auffaellig }}
          TOKEN_DA: ${{ steps.token.outputs.da }}
        run: |
          set -euo pipefail
          {
            echo "# KI-Wochenbericht"
            echo
            echo "## Was die KI dazu sagt"
            echo
            if [ -s einordnung.txt ]; then
              cat einordnung.txt
              echo
              echo "_Eingeordnet von einem Sprachmodell. Die Zahlen darunter sind"
              echo "gemessen, dieser Absatz ist es nicht._"
            elif [ "$TOKEN_DA" = "nein" ]; then
              echo "**Keine Einordnung: das Secret \`COPILOT_PAT\` ist nicht hinterlegt.**"
              echo "Gebraucht wird ein Fine-Grained Personal Access Token mit dem Recht"
              echo "\`Copilot Requests\`. Die Zahlen unten sind davon unberührt — sie sind"
              echo "gemessen, nicht erfragt."
            else
              echo "**Keine Einordnung: der KI-Dienst hat nicht geantwortet.**"
              echo "Die Meldung der CLI steht im Protokoll des Laufs, im Schritt"
              echo "\`Die KI einordnen lassen\` zwischen \`--- Meldung der CLI ---\` und"
              echo "\`--- Ende ---\`. Die Zahlen unten sind davon unberührt — sie sind"
              echo "gemessen, nicht erfragt."
            fi
            echo
            cat messung.md
            echo
            echo "[Der Lauf]($LAUF)"
          } > bericht.md
          cat bericht.md >> "$GITHUB_STEP_SUMMARY"
          if [ "$AUFFAELLIG" = "ja" ]; then
            titel="Wochenbericht: etwas ist auffällig ($(date -u +%F))"
            # `export`, nicht nur zuweisen: die Python-Zeile unten liest den
            # Titel aus der Umgebung. Von Hand zusammengebautes JSON zerbricht
            # am ersten Anfuehrungszeichen im Bericht, deshalb baut ihn Python.
            export TITEL="$titel"
            curl --fail-with-body -sS -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/issues" \
              -d "$(python3 -c 'import json,os; print(json.dumps({"title": os.environ["TITEL"], "body": open("bericht.md").read()}))' )" \
              > /dev/null
            echo "Issue geöffnet."
          else
            echo "Nichts Auffälliges gemessen -- kein Issue. Der Bericht steht in der Zusammenfassung."
          fi
