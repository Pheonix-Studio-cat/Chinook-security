# Claude auf Zuruf -- und einmal die Woche von selbst.
#
# **Der Knopf:** Actions -> "Claude" -> *Run workflow*. Dort steht ein
# Textfeld. Was du hineinschreibst, arbeitet Claude in diesem Repo ab und
# legt das Ergebnis als Pull Request an. Du brauchst dafuer kein Terminal.
#
# **Der Dauerauftrag:** montags frueh liest Claude `.github/dauerauftrag.md`
# und arbeitet ab, was dort steht -- ohne dass jemand etwas druecken muss.
#
# ## Was das kostet
#
# Jeder Lauf ruft die Anthropic-API auf und kostet echtes Geld, abgerechnet
# ueber den Schluessel im Secret `ANTHROPIC_API_KEY`. Der Dauerauftrag laeuft
# **einmal pro Woche**, nicht bei jedem Push -- das ist Absicht.
name: Claude

on:
  workflow_dispatch:
    inputs:
      auftrag:
        description: "Was soll Claude in diesem Repo tun?"
        required: true
        type: string
      gruendlich:
        description: "Wie viele Schritte darf Claude hoechstens machen?"
        required: false
        default: "25"
        type: string
  schedule:
    # Montags um 5 Uhr UTC, eine Stunde vor dem Wochenlauf der Bots.
    - cron: "0 5 * * 1"

# Jedes Recht muss einzeln dastehen. Was hier fehlt, ist `none` -- nicht
# geerbt. Siehe workspace-for-claude, `projekte/workspace-for-claude/03-fehler.md`
# Nr. 2: genau daran ist dort ein Bot mit HTTP 403 gescheitert.
permissions:
  contents: write        # Zweig anlegen und committen
  pull-requests: write   # den Pull Request eroeffnen
  issues: write          # Zwischenstand als Kommentar
  actions: read          # eigene Action-Protokolle lesen duerfen

jobs:
  claude:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Claude soll die Vorgeschichte sehen koennen, nicht nur den Kopf.
          fetch-depth: 0

      # Ohne Schluessel kann der Lauf nichts tun. Er sagt es **laut**, statt
      # gruen durchzulaufen -- ein Lauf, der stillschweigend nichts tut, sieht
      # aus wie einer, der etwas getan hat.
      - name: Ist der Schluessel hinterlegt?
        env:
          SCHLUESSEL: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SCHLUESSEL:-}" ]; then
            echo "::error::Das Secret ANTHROPIC_API_KEY fehlt. Anlegen unter Settings -> Secrets and variables -> Actions -> New repository secret. Ohne den Schluessel kann Claude nicht aufgerufen werden."
            exit 1
          fi
          echo "Schluessel ist hinterlegt."

      # Bei `workflow_dispatch` kommt der Auftrag aus dem Textfeld, beim
      # Zeitplan aus der Datei. Zusammengesetzt wird er hier, damit unten nur
      # noch ein fertiger Text steht.
      - name: Welcher Auftrag?
        id: auftrag
        env:
          AUS_DEM_FELD: ${{ inputs.auftrag }}
        run: |
          set -euo pipefail
          {
            echo "text<<AUFTRAGSENDE"
            if [ -n "${AUS_DEM_FELD:-}" ]; then
              echo "$AUS_DEM_FELD"
            else
              echo "Dies ist der woechentliche Lauf. Arbeite den Dauerauftrag ab, der unten steht."
              echo
              cat .github/dauerauftrag.md
            fi
            echo "AUFTRAGSENDE"
          } >> "$GITHUB_OUTPUT"

      - name: Claude
        uses: anthropics/claude-code-action@bf38e86e58df9ebf3420326d019f955bb3be64dd # v1.0.225
        # Der Commit, nicht das Tag-Objekt. `anthropics/claude-code-action`
        # benutzt **annotierte** Tags: `refs/tags/v1.0.225` zeigt dann auf ein
        # Tag-Objekt (8ded38b...), und erst `refs/tags/v1.0.225^{}` auf den
        # Commit (bf38e86...). `uses:` braucht den Commit.
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: ${{ steps.auftrag.outputs.text }}
          # `--max-turns` ist die Reissleine gegen einen Lauf, der sich
          # festfrisst: jeder Schritt kostet, und eine Obergrenze ist
          # billiger als eine Rechnung.
          claude_args: |
            --model claude-opus-5
            --max-turns ${{ inputs.gruendlich || '25' }}
          display_report: "true"
