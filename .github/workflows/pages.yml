# Baut die Website und veroeffentlicht sie auf GitHub Pages.
#
# **Ueber den Branch `gh-pages`, nicht ueber `actions/deploy-pages`.** Der Grund
# ist der Weg dorthin: Pages war im Repo nicht eingeschaltet, und die Einstellung
# laesst sich nur von Hand setzen. Das Anlegen eines `gh-pages`-Branches hat
# Pages dagegen von selbst aktiviert (`has_pages` sprang auf `true`). Damit
# braucht dieser Workflow keine Einstellung, die jemand vergessen kann.
#
# Die Seite wird **erzeugt**, nicht gepflegt: jede Regel darauf kommt aus dem
# Bot, der sie anwendet. Und sie zeigt den Stand der Gegenprobe -- deshalb wird
# die hier zuerst gefahren. Ist sie rot, bricht der Lauf ab und es wird nichts
# veroeffentlicht: eine Seite, die einen falschen Stand zeigt, ist schlimmer
# als keine.
name: Website

on:
  push:
    branches: [main]
  # Woechentlich neu bauen, auch ohne Commit: der Stand der Gegenprobe auf der
  # Seite soll aktuell sein, nicht vom letzten Merge stammen.
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  veroeffentlichen:
    runs-on: ubuntu-latest
    # Nur dieser Job darf schreiben, und nur, um den erzeugten Branch zu
    # setzen. Kein `write-all`.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Gegenprobe
        run: python3 -m checks.counterproof --json chinook-gegenprobe.json

      - name: Seite bauen
        run: python3 -m webseite.build --gegenprobe chinook-gegenprobe.json

      # Der Push laeuft ueber die Zugangsdaten, die `actions/checkout` schon
      # eingerichtet hat -- kein Token in einer Adresse, das in einem Protokoll
      # landen koennte.
      - name: Auf gh-pages veroeffentlichen
        run: |
          set -euo pipefail
          touch webseite/out/.nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Jedes Mal ein einzelner, frischer Commit. Der Branch ist erzeugter
          # Inhalt -- eine Historie darauf waere nur Ballast, und ein fester
          # Ausgangspunkt macht den Lauf wiederholbar.
          git worktree add --detach /tmp/seite
          git -C /tmp/seite checkout --orphan gh-pages
          git -C /tmp/seite rm -rq --cached . || true
          find /tmp/seite -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r webseite/out/. /tmp/seite/
          cd /tmp/seite
          git add -A
          git commit -q -m "Website aus ${GITHUB_SHA:0:12}"
          git push -q --force origin gh-pages
          echo "Veroeffentlicht: https://pheonix-studio-cat.github.io/${GITHUB_REPOSITORY#*/}/"
