# Chinook Security prueft sich selbst. Ein Sicherheitswerkzeug, das die eigenen Regeln
# nicht einhaelt, ist kein Argument.
name: Selbstpruefung

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Die History-Pruefung braucht die ganze History, nicht nur den Kopf.
          fetch-depth: 0

      - name: Pruefungen
        run: python3 -m unittest discover -s checks -t . -v

      - name: Gegenprobe -- jede Mutation muss die Pruefungen rot machen
        run: python3 -m checks.counterproof --json chinook-gegenprobe.json

      # Alle fuenf Bots auf das eigene Repo, ohne Ausnahmeliste.
      - name: Secret-Bot auf das eigene Repo
        uses: ./actions/secret-bot
        with:
          history: "true"
          fail-on: critical
          sarif: ""

      # Seit die eigenen Actions auf Commits festgelegt sind, meldet der
      # Workflow-Bot hier nichts mehr -- auch keinen Hinweis. Die Schwelle
      # steht deshalb auf `info`: was wir bei anderen anmahnen, halten wir
      # selbst, und ein Rueckfall faellt sofort auf.
      - name: Workflow-Bot auf das eigene Repo
        uses: ./actions/workflow-bot
        with:
          fail-on: info
          sarif: ""

      - name: Code-Bot auf das eigene Repo
        uses: ./actions/code-bot
        with:
          fail-on: medium
          sarif: ""

      - name: Lizenz-Bot auf das eigene Repo
        uses: ./actions/license-bot
        with:
          fail-on: medium
          sarif: ""

      - name: Dependency-Bot auf das eigene Repo
        uses: ./actions/dependency-bot
        with:
          fail-on: medium
          sarif: ""

      # Der Aufseher laeuft hier **ohne** Schluessel. Das ist kein Mangel, das
      # ist der Punkt: Chinook Security haelt keinen, und der freiwillige Pfad muss
      # gefahren werden, nicht behauptet. Der Schritt muss gruen sein und
      # `skipped` melden.
      - name: Einen Bericht fuer den Aufseher erzeugen
        uses: ./actions/workflow-bot
        with:
          fail-on: never
          report: chinook-workflow-bot.json
          sarif: ""

      - name: Aufseher ohne Schluessel -- muss "skipped" melden
        id: aufseher
        uses: ./actions/overseer
        with:
          reports: chinook-workflow-bot.json

      - name: Der freiwillige Pfad muss "skipped" heissen
        env:
          STAND: ${{ steps.aufseher.outputs.status }}
        run: |
          set -euo pipefail
          if [ "$STAND" != "skipped" ]; then
            echo "Der Aufseher meldet '$STAND' statt 'skipped'." >&2
            echo "Ohne Schluessel darf er nichts einordnen -- und trotzdem nicht scheitern." >&2
            exit 1
          fi
          python3 -c 'import json,sys; a=json.load(open("chinook-overseer.json"))["findings"]; b=json.load(open("chinook-workflow-bot.json"))["findings"]; sys.exit(0) if len(a)==len(b) else sys.exit(f"Der Aufseher hat die Zahl der Befunde veraendert: {len(b)} -> {len(a)}")'
          echo "Befunde unveraendert durchgereicht."

  # Der einzige Schritt, der an einem fremden Dienst haengt. Er darf fehlschlagen,
  # ohne den Lauf zu kippen: er ist **Auskunft** darueber, ob OSV gerade
  # antwortet, keine Zusicherung ueber Chinook Security. Die Bot-Logik selbst wird in
  # `checks/test_dependency_bot.py` gegen einen eigenen Stub gefahren.
  netzprobe:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Erreicht die OSV-Abfrage die echte Adresse?
        run: |
          set -uo pipefail
          arbeitsordner=$(mktemp -d)
          printf 'django==2.2.0\n' > "$arbeitsordner/requirements.txt"
          python3 -m chinook.cli dependency-bot --path "$arbeitsordner" --fail-on never
          status=$?
          rm -rf "$arbeitsordner"
          if [ "$status" -eq 2 ]; then
            echo "OSV war nicht erreichbar. Das sagt nichts ueber Chinook Security aus." >&2
            exit 1
          fi
          exit 0

      # Schickt Chinook Security Oekosystem-Namen, die OSV kennt? Ein falsch
      # geschriebener Name findet nichts -- und nichts sieht aus wie „sauber".
      - name: Kennt OSV die Oekosystem-Namen?
        run: python3 -m checks.oekosystemprobe
