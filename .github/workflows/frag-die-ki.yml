# VERSUCH -- nicht zum Mergen. Beantwortet eine einzige Frage:
# kommt die Copilot-CLI in Actions mit dem eingebauten GITHUB_TOKEN durch,
# oder braucht sie ein eigenes Token?
name: Frag die KI

on:
  workflow_dispatch:
    inputs:
      frage:
        description: "Was willst du über dieses Repo wissen?"
        required: true
        type: string

permissions:
  contents: read
  models: read

jobs:
  fragen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Copilot-CLI installieren
        run: npm install -g @github/copilot

      # Die Action schluckt die stderr der CLI. Also einmal von Hand, damit
      # die echte Meldung sichtbar wird.
      - name: Was sagt die CLI wirklich?
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          copilot -p "Sag Hallo." -s --no-ask-user --model gpt-4.1 > raus.txt 2> fehler.txt
          stand=$?
          echo "Exit: $stand"
          echo "--- stdout ---"
          cat raus.txt
          echo "--- stderr ---"
          cat fehler.txt
          exit 0

      - name: Frage stellen
        id: ki
        uses: actions/ai-inference@2c43c91ae16266ca159d311430343c67a5ffa222 # v3
        with:
          prompt: ${{ inputs.frage }}
          system-prompt: "Antworte auf Deutsch, in hoechstens drei Saetzen."
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Antwort anzeigen
        env:
          ANTWORT: ${{ steps.ki.outputs.response }}
        run: |
          set -euo pipefail
          printf '%s\n' "$ANTWORT" >> "$GITHUB_STEP_SUMMARY"
