# Frag die KI -- ein Eingabefeld im Actions-Reiter.
#
# **So benutzt du es:** Actions -> "Frag die KI" -> *Run workflow*. Frage
# eintippen, Start druecken, Antwort steht in der Zusammenfassung des Laufs.
# Lesbar am iPad, ohne Terminal.
#
# ## Was einmal eingerichtet werden muss
#
# Ein Repository-Secret namens `COPILOT_PAT`: ein **Fine-Grained Personal
# Access Token** mit dem Recht **"Copilot Requests"**. Anzulegen unter
# Settings -> Developer settings -> Personal access tokens, zu hinterlegen
# unter Settings -> Secrets and variables -> Actions.
#
# Fehlt es, sagt der erste Schritt das im Klartext, statt gruen
# durchzulaufen.
#
# ## Warum nicht GitHub Models
#
# **Weil es den Dienst nicht mehr gibt.** Die erste Fassung dieser Datei rief
# GitHub Models mit dem eingebauten `GITHUB_TOKEN` auf -- kein Secret, kein
# zweites Konto. Der erste echte Lauf antwortete:
#
#     410 GitHub Models is temporarily unavailable as part of a
#     scheduled retirement brownout.
#
# Der Dienst wird abgeschaltet. Genau deshalb ist `actions/ai-inference` ab
# v3 auf die Copilot-CLI umgestiegen -- das war kein Versionssprung, das war
# der Umzug.
#
# Und der eingebaute `GITHUB_TOKEN` genuegt der Copilot-CLI **nicht**.
# Ausprobiert, nicht vermutet; die CLI antwortete:
#
#     Error: Authentication failed
#     If using a Fine-Grained PAT, ensure it has the
#     'Copilot Requests' permission enabled
#
# ## Was es **nicht** kann
#
# Es beantwortet Fragen. Es **aendert keinen Code** und oeffnet keinen Pull
# Request. Wer Code geaendert haben will, fragt Claude in einer Sitzung.
name: Frag die KI

on:
  workflow_dispatch:
    inputs:
      frage:
        description: "Was willst du über dieses Repo wissen?"
        required: true
        type: string
      umfang:
        description: "Wie viel vom Repo soll die KI mitlesen?"
        required: false
        default: "README und docs"
        type: choice
        options:
          - "README und docs"
          - "nur die Dateiliste"
          - "README, docs und die Regeltabellen der Bots"

permissions:
  contents: read

jobs:
  fragen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Ohne Token kann der Lauf nichts tun. Er sagt es **laut**, statt gruen
      # durchzulaufen -- ein Lauf, der stillschweigend nichts tut, sieht aus
      # wie einer, der etwas getan hat.
      - name: Ist das Token hinterlegt?
        env:
          TOKEN: ${{ secrets.COPILOT_PAT }}
        run: |
          set -euo pipefail
          if [ -z "${TOKEN:-}" ]; then
            echo "::error::Das Secret COPILOT_PAT fehlt. Gebraucht wird ein Fine-Grained Personal Access Token mit dem Recht 'Copilot Requests', hinterlegt unter Settings -> Secrets and variables -> Actions. Ohne das Token weist die Copilot-CLI die Anfrage mit 'Authentication failed' zurueck."
            exit 1
          fi
          # Ueber den **Wert** wird hier nichts ausgegeben -- nur Laenge und
          # Form. Beides genuegt, um die haeufigste Ursache zu erkennen: ein
          # am Tablet unvollstaendig kopiertes Token. Die CLI sagt dazu nur
          # "Bad credentials" und laesst offen, ob der Wert falsch ist oder
          # ein Recht fehlt.
          laenge=${#TOKEN}
          echo "Token hinterlegt, $laenge Zeichen."
          case "$TOKEN" in
            github_pat_*) echo "Form: Fine-Grained PAT. Richtig." ;;
            ghp_*) echo "::warning::Form: klassisches Token (ghp_). Die Copilot-CLI will ein Fine-Grained PAT." ;;
            *) echo "::warning::Das Token beginnt weder mit github_pat_ noch mit ghp_ -- vermutlich unvollstaendig kopiert." ;;
          esac
          if [ "$laenge" -lt 40 ]; then
            echo "::warning::Nur $laenge Zeichen. Ein Fine-Grained PAT ist deutlich laenger; das sieht abgeschnitten aus."
          fi
          # Fuehrende oder nachgestellte Leerzeichen ueberleben das Einfuegen
          # und machen jeden Kopfzeileneintrag ungueltig.
          beschnitten=$(printf '%s' "$TOKEN" | tr -d ' \t\n\r')
          if [ "${#beschnitten}" -ne "$laenge" ]; then
            echo "::error::Im Secret stehen Leerzeichen oder ein Zeilenumbruch. Neu einfuegen, ohne Rand."
            exit 1
          fi

          # Die entscheidende Unterscheidung: liegt es am Wert oder am Recht?
          # Diese Anfrage braucht **kein** besonderes Recht. Kommt hier 401,
          # ist der Wert falsch; kommt 200, ist der Wert gut und es fehlt das
          # Copilot-Recht.
          code=$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $TOKEN" https://api.github.com/user)
          echo "GitHub-API /user antwortet: HTTP $code"
          if [ "$code" = "401" ]; then
            echo "::error::HTTP 401 -- GitHub kennt dieses Token nicht. Der Wert im Secret ist falsch, abgelaufen oder unvollstaendig. Neu erzeugen unter Settings -> Developer settings -> Personal access tokens -> Fine-grained, den Wert mit dem Kopier-Knopf uebernehmen und das Secret COPILOT_PAT ersetzen."
            exit 1
          fi
          if [ "$code" != "200" ]; then
            echo "::error::Unerwartete Antwort HTTP $code von der GitHub-API. Der Grund steht nicht hier; ohne gueltiges Token braucht die CLI gar nicht erst zu starten."
            exit 1
          fi
          echo "Das Token ist gueltig. Bleibt die Frage, ob es Copilot darf -- das sagt die CLI gleich selbst."

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      # Die CLI ist auf den Runnern nicht vorinstalliert.
      - name: Copilot-CLI installieren
        run: npm install -g @github/copilot

      # Ohne Zusammenhang antwortet die KI ins Blaue. Begrenzt, weil ein zu
      # langer Text abgewiesen oder abgeschnitten wird -- und dann fehlt die
      # Haelfte, ohne dass es jemandem auffaellt.
      - name: Frage und Zusammenhang zusammenstellen
        env:
          UMFANG: ${{ inputs.umfang }}
          FRAGE: ${{ inputs.frage }}
        run: |
          set -euo pipefail
          {
            echo "# Die Frage"
            echo
            printf '%s\n' "$FRAGE"
            echo
            echo "# Zum Nachlesen: das Repo Chinook Security"
            echo
            echo "## Dateien"
            git ls-files | head -120
            echo
            if [ "$UMFANG" != "nur die Dateiliste" ]; then
              echo "## README.md"
              head -c 9000 README.md
              echo
              for d in docs/*.md; do
                [ -f "$d" ] || continue
                echo "## $d"
                head -c 2500 "$d"
                echo
              done
            fi
            if [ "$UMFANG" = "README, docs und die Regeltabellen der Bots" ]; then
              echo "## Die Regeln, die die Bots anwenden"
              # Einzeiler mit Semikolons, kein mehrzeiliges Skript: eine Zeile
              # auf Spalte 0 wuerde den YAML-Block beenden, und GitHub koennte
              # die Datei nicht mehr laden. Daran ist schon einmal eine
              # action.yml gescheitert. Gefangen hat es
              # `checks/test_yaml_bloecke.py`.
              python3 -c 'import json; from webseite import build; [print(f"### {n}", json.dumps(m.regeln(), ensure_ascii=False, indent=1), sep=chr(10)) for m, n, _ in build.BOTS]'
            fi
          } > roh.txt
          head -c 24000 roh.txt > frage.txt
          roh=$(wc -c < roh.txt)
          jetzt=$(wc -c < frage.txt)
          echo "Zusammenhang: $roh Zeichen, davon $jetzt geschickt."
          if [ "$roh" -gt "$jetzt" ]; then
            echo "::warning::Der Zusammenhang wurde auf $jetzt Zeichen gekuerzt. Die Antwort kennt den Rest nicht."
          fi

      # **Die CLI direkt, ohne `actions/ai-inference`.**
      #
      # Die Action tut nichts anderes, als genau diesen Befehl zu bauen --
      # aber sie **verschluckt die Fehlerausgabe der CLI** und meldet nur
      # "exited with code 1. Re-run with ACTIONS_STEP_DEBUG=true". Das ist
      # eine Meldung, die nichts sagt, und sie hat hier schon zweimal einen
      # ganzen Lauf gekostet.
      #
      # Direkt aufgerufen steht der Grund im Protokoll, beim ersten Mal.
      # Eine Zwischenschicht, die Fehler verbirgt, ist keine Vereinfachung.
      - name: Frage stellen
        id: ki
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_PAT }}
        run: |
          # `set +e`: GitHub startet jeden run-Block mit `bash -e`. Ohne das
          # Aufheben braeche der Block beim Fehlschlag ab, bevor die Meldung
          # der CLI ausgegeben wird -- genau das ist hier schon passiert.
          set +e
          anweisung='Du beantwortest Fragen über das Repo "Chinook Security" -- ein Werkzeugkasten aus Sicherheits-Bots, die als GitHub Actions laufen. Antworte auf Deutsch, knapp und konkret. Stütze dich ausschliesslich auf den mitgelieferten Zusammenhang. Weisst du etwas nicht, sag das -- erfinde keine Zahlen, keine Dateinamen und keine Commit-SHAs. "Ich weiss es nicht" ist eine vollständige Antwort.'
          printf '%s\n\n' "$anweisung" > auftrag.txt
          cat frage.txt >> auftrag.txt
          copilot -p "$(cat auftrag.txt)" -s --no-ask-user > antwort.txt 2> fehler.txt
          stand=$?
          if [ "$stand" -ne 0 ]; then
            echo "::error::Die Copilot-CLI ist mit Exit $stand ausgestiegen. Ihre eigene Meldung steht direkt darunter."
            echo "--- Meldung der CLI ---"
            cat fehler.txt
            echo "--- Ende ---"
            exit "$stand"
          fi
          # Auch ein Exit 0 kann leer sein. Leer ist kein Ergebnis.
          if [ ! -s antwort.txt ]; then
            echo "::error::Die CLI ist ohne Fehler ausgestiegen, hat aber nichts geantwortet."
            cat fehler.txt
            exit 1
          fi
          echo "Antwort: $(wc -c < antwort.txt) Zeichen."

      # Die Antwort gehoert dorthin, wo er sie am iPad sieht: in die
      # Zusammenfassung des Laufs, nicht nur ins Protokoll.
      - name: Antwort anzeigen
        env:
          FRAGE: ${{ inputs.frage }}
        run: |
          set -euo pipefail
          {
            echo "## Frage"
            echo
            printf '%s\n' "$FRAGE"
            echo
            echo "## Antwort"
            echo
            cat antwort.txt
            echo
            echo "---"
            echo "_Über die Copilot-CLI beantwortet. Die KI hat nur gelesen, nichts geändert._"
          } >> "$GITHUB_STEP_SUMMARY"
